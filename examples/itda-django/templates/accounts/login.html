<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — 가상 상점</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="mx-auto mt-16 max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-xl font-bold">🛍️ 가상 상점</h1>
    <p class="mt-1 text-sm text-slate-500">고객 계정으로 로그인한다.</p>

    {% if form.errors %}
    <p class="mt-4 rounded-lg border border-rose-300 bg-rose-50 px-3 py-2 text-sm text-rose-800">
      아이디 또는 비밀번호가 맞지 않는다.
    </p>
    {% endif %}

    <form method="post" class="mt-4 space-y-3">
      {% csrf_token %}
      <div>
        <label for="{{ form.username.id_for_label }}" class="block text-sm font-semibold">아이디</label>
        <input type="text" name="username" id="{{ form.username.id_for_label }}" autofocus
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label for="{{ form.password.id_for_label }}" class="block text-sm font-semibold">비밀번호</label>
        <input type="password" name="password" id="{{ form.password.id_for_label }}"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <button class="w-full rounded-lg bg-slate-900 px-4 py-2 font-semibold text-white hover:bg-slate-700">
        로그인
      </button>
    </form>

    <p class="mt-4 text-xs text-slate-400">
      고객 <span class="font-mono">alice</span> · <span class="font-mono">bob</span> /
      <span class="font-mono">pass1234</span>
    </p>
  </div>
</body>
</html>
