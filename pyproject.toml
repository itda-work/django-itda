[project]
name = "itda-django"
version = "0.1.0"
description = "실행세계를 단계별로 엿보는 Django 교육용 프로젝트"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    # 실행세계 도구면 패키지 — 같은 저장소의 workspace 멤버(packages/django-itda).
    # 8단계에서 agent/live/mcp_server.py(임시)를 이 패키지의 선언으로 대체한다.
    "django-itda",
]

[project.optional-dependencies]
live = [
    "fastmcp>=4,<5",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["stage_*.py", "live_*.py", "test_*.py"]
testpaths = ["tests"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
django-itda = { workspace = true }
